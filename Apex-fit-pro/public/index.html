<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06060e" />
    <meta name="description" content="Workouts, AI food scanning, nutrition and wearable tracking." />
    <title>Apex Fit Pro</title>

    <!-- Installable app -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apex Fit" />
    <style>
      /* Space taken by the phone's status bar / navigation bar. Inside the Android app Capacitor sets
         --safe-area-inset-*; in a browser env() is used (both are 0 on a normal web page). */
      :root {
        --sat: max(var(--safe-area-inset-top, 0px), env(safe-area-inset-top, 0px));
        --sab: max(var(--safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
      }
    </style>
  </head>
  <body style="background:#06060e">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
